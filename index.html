<script>
// ==================== 頁面切換控制 ====================
function switchTab(tabId, titleText) {
  // 隱藏所有分頁內容
  $(".tab-content").removeClass("active");
  // 顯示選定的分頁
  $("#tab-" + tabId).addClass("active");
  // 更改 Banner 標題文字
  $("#banner-title").text(titleText);

  // 如果切換到「榮譽積點排名」，自動載入資料
  if (tabId === 'ranking') {
    loadRankingData();
  }
}

// ==================== 1. 首頁積點查詢邏輯 ====================
const PASS_SHEET   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQThuhmGHZOfsVNddknBBS34NAx7j5sEVhY6yxOT7h89EqDnPDftzIDip8K8edHigKtQmZJWO2wz629/pub?gid=0&single=true&output=csv";
const SUM_SHEET    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSFYIV6HeZAAXG0amrkLS9wwclpcK4qUTb_ApXQZGo3tWNQ-l-UIM1yl9Kt1T2zz7JXO-v_CtLdc6uL/pub?gid=0&single=true&output=csv";
const RECORD_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTq6WJBfbZW7NyN_Kn3KLUHcZ_6SdWTTyMaPiM0XQFP-m1j7hjJIC5D-SwzeLKzxboQ1HxJfbDTIYYZ/pub?gid=0&single=true&output=csv";

let loggedID = "";
let loggedPW = "";

async function loadCSV(url){
  const res = await fetch(url);
  const text = await res.text();
  return text.trim().split("\n").map(r => r.split(","));
}

async function login(id, passwd){
  const data = await loadCSV(PASS_SHEET);
  for(let i=0; i<data.length; i++){
    if(data[i][0].trim() === id && data[i][1].trim() === passwd){
      return true;
    }
  }
  return false;
}

async function queryData(sheet, id){
  const data = await loadCSV(sheet);
  const title = data[0].slice(1).map((t, index) => {
    t = t.replace(/^"|"$/g, "");
    if($("#exam").val() === "sum") {
      if(index === 0) return "姓名";
      return t.replace(/學號.*$/g, "");
    }
    return t;
  });

  const rows = data.filter((r,i) => i>0 && r[0].trim()===id).map(r => r.slice(1));
  return {title, rows};
}

function outputTable(title, rows){
  $("#mytable thead").empty();
  $("#mytable tbody").empty();
  $("#mytable thead").append("<tr>" + title.map(t => "<th>"+t+"</th>").join("") + "</tr>");
  rows.forEach(r => {
    $("#mytable tbody").append("<tr>" + r.map(c => "<td>"+c+"</td>").join("")+"</tr>");
  });
}

async function doQuery() {
  if(!loggedID || !loggedPW) return;
  let exam = $("#exam").val();
  if(!exam) return;
  let sheet = exam === "sum" ? SUM_SHEET : RECORD_SHEET;
  let data = await queryData(sheet, loggedID);
  $("#output").css("color", "green").text("查詢成功");
  outputTable(data.title, data.rows);
}

$("#myForm").on("submit", async function(e){
  e.preventDefault();
  let id = $("#id").val().trim();
  let pw = $("#passwd").val().trim();
  let exam = $("#exam").val();

  if(!exam){
    $("#output").css("color", "red").text("請先選擇查詢項目");
    return;
  }

  $("#output").css("color", "gray").text("驗證中，請稍候...");

  if(!await login(id, pw)){
    $("#output").css("color", "red").text("系統訊息： 學號或密碼錯誤");
    return;
  }

  loggedID = id;
  loggedPW = pw;
  doQuery();
});

$("#exam").on("change", function(){
  doQuery();
});

// ==================== 3. 積點排名邏輯 ====================
let isRankingLoaded = false;
function loadRankingData() {
  if (isRankingLoaded) return;

  const sheetURL = "https://docs.google.com/spreadsheets/d/1jBfyiIfgLaZ670WGInYjTqs45O42sy7hTmt4MLlKcMI/gviz/tq?tqx=out:json";

  fetch(sheetURL)
    .then(res => res.text())
    .then(txt => {
      const jsonText = txt.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1];
      const data = JSON.parse(jsonText);

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      const cols = data.table.cols.map(c => c ? c.label : "");
      const trHead = document.createElement("tr");
      cols.forEach(c => {
        const th = document.createElement("th");
        th.textContent = c;
        trHead.appendChild(th);
      });
      tableHead.appendChild(trHead);

      data.table.rows.forEach(r => {
        const tr = document.createElement("tr");
        r.c.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell ? (cell.v !== null ? cell.v : "") : "";
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      });
      isRankingLoaded = true;
    })
    .catch(err => console.error("排名載入失敗：", err));
}

function bestdaylong_show(str) {
  if (!str.trim()) {
    alert("請輸入驗證碼");
    return;
  }

  var xmlhttp = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject("Microsoft.XMLHTTP");

  xmlhttp.onreadystatechange = function () {
    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
      var result = xmlhttp.responseText;
      var obj = JSON.parse(result);

      var html = '<table>';
      for (var i = 0; i < obj.length; i++) {
        html += '<tr>';
        for (var j = 0; j < obj[i].data.length; j++) {
          html += '<td>' + obj[i].data[j] + '</td>';
        }
        html += '</tr>';
      }
      html += '</table>';

      document.getElementById("order_status").innerHTML = html;
      if (obj.length == 1) {
        alert("查無資料");
      }
    }
  };

  var url = "https://script.google.com/macros/s/AKfycbzein3UduPyHisni770nm6SjJM51AiC-l2rMmY-xEXXiZgqGNfDa9m7lk5Cw2dQuWgs/exec";
  var get_url = url + "?uid=" + encodeURIComponent(str);
  xmlhttp.open("GET", get_url, true);
  xmlhttp.send();
}
